<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlipBuilder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <p class="eyebrow">NFL pick'em</p>
        <h1>SlipBuilder</h1>
      </div>
    </header>

    <aside class="rates" aria-labelledby="rates-title">
      <h2 id="rates-title">Hit rate</h2>
      <div id="rates-body" class="rates-body">
        <p class="muted">Loading…</p>
      </div>
    </aside>

    <main class="chat">
      <div id="transcript" class="transcript" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="message">Message</label>
        <input id="message" name="message" type="text" placeholder="Ask for a slip" maxlength="500" required>
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
